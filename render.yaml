# Render Blueprint: Dashboard → New → Blueprint → chọn repo này.
services:
  - type: web
    name: quizta
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: SUPABASE_BUCKET
        value: media
      # 3 biến dưới đây Render sẽ hỏi khi tạo (không lưu trong code):
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
